<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">EPL Energetics and Propulsion Laboratory Logo</title>
  <desc id="logoDesc">EPL lettering with an angled rocket integrated into the logo and the full lab name below.</desc>
  <defs>
    <linearGradient id="rocketGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#174b7a" />
      <stop offset="100%" stop-color="#0b5dab" />
    </linearGradient>
    <linearGradient id="flameGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb23e" />
      <stop offset="100%" stop-color="#ff6f2f" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.18" />
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <text x="12" y="104" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="118" fill="#10284f">E</text>
    <text x="182" y="104" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="118" fill="#0b5dab">P</text>
    <text x="366" y="104" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900" font-size="118" fill="#0e3f74">L</text>
  </g>
  <g transform="translate(395 18) rotate(-14 80 40)">
    <path d="M24 4c16-6 42-10 60 6 18 16 16 46-4 82-20 36-34 45-52 45-18 0-36-14-36-31 0-17 8-36 24-54 17-18 22-26 24-28 2-2 6-7 8-10z" fill="url(#rocketGradient)" />
    <path d="M88 24c-6 10-14 22-26 30" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.6" />
    <path d="M36 48c-8 12-8 26-2 36" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.45" />
    <path d="M10 70c10-4 20-8 34-4 14 4 22 14 24 28" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.4" />
    <path d="M56 124c-10 10-22 18-34 20-12 2-20-2-26-10" fill="url(#flameGradient)" opacity="0.95" />
  </g>
  <text x="16" y="162" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="#174b7a" letter-spacing="0.18em">ENERGETICS AND PROPULSION LABORATORY</text>
</svg>
